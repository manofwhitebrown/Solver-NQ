name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: npm run build
        run: |
          npm run build 2>&1 | tee step.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=npm run build failed::$(tail -n 40 step.log | tr '\n' ' ' | cut -c1-3500)"; exit $s; fi
      - name: cap sync
        run: |
          npx cap sync android 2>&1 | tee step.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=cap sync failed::$(tail -n 40 step.log | tr '\n' ' ' | cut -c1-3500)"; exit $s; fi
      - run: chmod +x android/gradlew
      - name: Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug 2>&1 | tee step.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=gradle assembleDebug failed::$(tail -n 40 step.log | tr '\n' ' ' | cut -c1-3500)"; exit $s; fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: solver-nq-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
