name: Create signing keystore
# Manual helper. Run it ONCE to make the key that signs the release APK.
# See docs/RELEASE.md for the step-by-step guide.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tick this to confirm you do NOT already have a release key (making a new one replaces it)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation box
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error title=Not confirmed::Run the workflow again and tick the confirmation box."
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make the keystore
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/keystore-out"
          mkdir -p "$OUT"

          # Random password (hex digits only, so it is safe in Gradle and shells; 112 bits of randomness).
          # PKCS12 keystores need the store and key password to be the same, so one value is used for both.
          PASS="$(openssl rand -hex 14)"
          echo "::add-mask::$PASS"
          ALIAS="solvernq"

          keytool -genkeypair -noprompt \
            -keystore "$OUT/release.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Solver-NQ, O=Solver-NQ, C=IN" > /dev/null 2>&1

          B64="$(base64 -w0 "$OUT/release.jks")"
          echo "::add-mask::$B64"

          # Prove the key opens with the password before handing it over (output is not printed).
          keytool -list -keystore "$OUT/release.jks" -storepass "$PASS" -alias "$ALIAS" > /dev/null 2>&1

          {
            echo "SOLVER-NQ SIGNING KEY - KEEP PRIVATE. Anyone with this file can publish updates as you."
            echo "Copy each value below into GitHub > Settings > Secrets and variables > Actions > New repository secret."
            echo "Secret name = the word before the colon. Secret value = everything on the line after it."
            echo
            echo "ANDROID_KEY_ALIAS: $ALIAS"
            echo "ANDROID_KEYSTORE_PASSWORD: $PASS"
            echo "ANDROID_KEY_PASSWORD: $PASS"
            echo "ANDROID_KEYSTORE_BASE64: $B64"
            echo
            echo "Back up this whole file AND release.jks in two separate safe places."
            echo "If the key is lost you can never publish an update to the same app."
          } > "$OUT/SECRETS.txt"

          # Only the public fingerprint goes into the (visible) log.
          echo "Keystore created and checked. SHA-256 fingerprint (public, not secret):"
          keytool -list -v -keystore "$OUT/release.jks" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null | grep -i "SHA256:" || true
          echo "KEYSTORE_OUT=$OUT" >> "$GITHUB_ENV"
      - name: Upload the private artifact (kept 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: solver-nq-keystore
          path: ${{ env.KEYSTORE_OUT }}
          retention-days: 1
          if-no-files-found: error
