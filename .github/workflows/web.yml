name: Web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false  # let runs finish; many pushes would otherwise cancel the APK upload
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash .github/scripts/secret-scan.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
        env:
          VITE_BASE: /Solver-NQ/   # must be on the BUILD step: without it the page asks for /assets/... at the domain root and is blank
      - name: Check the build uses the /Solver-NQ/ base
        run: grep -q 'src="/Solver-NQ/assets/' dist/index.html || { echo "::error::dist/index.html does not use the /Solver-NQ/ base (blank page on GitHub Pages)"; exit 1; }
      - run: node scripts/ci-size.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
