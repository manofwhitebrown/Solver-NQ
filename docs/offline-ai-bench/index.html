<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solver-NQ offline model benchmark</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 46rem; margin-inline: auto; }
  button, select { font: inherit; min-height: 44px; padding: 0 16px; margin: 4px 8px 4px 0; }
  select { max-width: 100%; box-sizing: border-box; display: block; }
  body { overflow-wrap: anywhere; }
  pre, textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; }
  textarea { height: 14rem; }
  .bad { color: #b02430; } .ok { color: #127852; }
  progress { width: 100%; }
</style>
</head>
<body>
<h1>Offline model benchmark</h1>
<p>Runs 30 school questions on a small model inside this browser (WebGPU) and reports speed and how many answers were right. Nothing is uploaded. First run downloads the model (about 0.7 to 1 GB); keep the screen on and use Wi-Fi.</p>
<p id="env"></p>
<label>Model
  <select id="model">
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B Instruct (q4f16, about 1 GB)</option>
    <option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC">Qwen2.5 1.5B Instruct (q4f32, if f16 is not supported)</option>
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B Instruct (q4f16, 695 MB)</option>
    <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama 3.2 1B Instruct (q4f32)</option>
  </select>
</label>
<div>
  <button id="run">Run benchmark</button>
  <button id="stop" disabled>Stop</button>
</div>
<progress id="bar" value="0" max="30"></progress>
<p id="status" role="status">Idle.</p>
<h2>Result (copy and paste this back)</h2>
<textarea id="out" readonly aria-label="Result"></textarea>
<div><button id="copy">Copy result</button></div>
<script type="module">
import { QUESTIONS } from './questions.mjs';
import { isCorrect, extractNumber } from './grade.mjs';

const $ = (id) => document.getElementById(id);
const out = $('out'), status = $('status'), bar = $('bar');
const WEBLLM = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm';
let stopRequested = false;

// navigator.gpu can exist with no usable adapter (headless, blocklisted drivers), so ask for the adapter itself.
let adapter = null;
try { adapter = 'gpu' in navigator ? await navigator.gpu.requestAdapter() : null; } catch { /* no adapter */ }
const hasGpu = !!adapter;
const f16 = !!adapter?.features.has('shader-f16');
$('env').innerHTML = `WebGPU: <b class="${hasGpu ? 'ok' : 'bad'}">${hasGpu ? 'available' : 'NOT available'}</b> · shader-f16: <b>${f16 ? 'yes' : 'no'}</b> · secure context: <b>${isSecureContext ? 'yes' : 'no'}</b>`;
if (!hasGpu) {
  status.textContent = isSecureContext
    ? 'This browser has no usable WebGPU adapter, so the benchmark cannot run here. Try Chrome 121+ on Android 12+ or desktop Chrome/Edge.'
    : 'WebGPU needs a secure context: open this page as http://localhost:PORT (on a phone: adb reverse tcp:8000 tcp:8000) or over https.';
  $('run').disabled = true;
}
if (hasGpu && !f16) $('model').value = $('model').value.replace('q4f16', 'q4f32');

const lines = [];
const log = (s) => { lines.push(s); out.value = lines.join('\n'); };

$('stop').onclick = () => { stopRequested = true; };
$('copy').onclick = async () => { out.select(); try { await navigator.clipboard.writeText(out.value); status.textContent = 'Copied.'; } catch { status.textContent = 'Select the text and copy it by hand.'; } };

$('run').onclick = async () => {
  stopRequested = false; lines.length = 0; bar.value = 0;
  $('run').disabled = true; $('stop').disabled = false;
  const model = $('model').value;
  try {
    status.textContent = 'Loading the WebLLM library…';
    const webllm = await import(WEBLLM);
    const t0 = performance.now();
    const engine = await webllm.CreateMLCEngine(model, {
      initProgressCallback: (r) => { status.textContent = r.text; },
    }, { context_window_size: 2048 });
    const loadS = (performance.now() - t0) / 1000;
    log(`Solver-NQ offline benchmark ${new Date().toISOString()}`);
    log(`Model: ${model}`);
    log(`Device: ${navigator.userAgent}`);
    log(`Cores: ${navigator.hardwareConcurrency ?? '?'}  Memory hint (GB): ${navigator.deviceMemory ?? '?'}  f16: ${f16}`);
    log(`Load time (download or cache + compile): ${loadS.toFixed(1)} s`);
    log('');
    let right = 0, done = 0, totalTok = 0, totalDecodeS = 0; const secs = []; const ttft = [];
    for (const item of QUESTIONS) {
      if (stopRequested) break;
      status.textContent = `Question ${done + 1} of ${QUESTIONS.length}…`;
      const start = performance.now(); let first = 0, text = '', usage = null, chunks = 0;
      const stream = await engine.chat.completions.create({
        stream: true, stream_options: { include_usage: true }, temperature: 0, max_tokens: 400,
        messages: [
          { role: 'system', content: 'You are a careful maths and science tutor. Work step by step but briefly. End with one last line exactly like: ANSWER: <number only>' },
          { role: 'user', content: item.q },
        ],
      });
      for await (const ch of stream) {
        const d = ch.choices?.[0]?.delta?.content;
        if (d) { if (!first) first = performance.now(); text += d; chunks++; }
        if (ch.usage) usage = ch.usage;
      }
      const end = performance.now();
      const tokens = usage?.completion_tokens ?? chunks;
      const decodeS = first ? (end - first) / 1000 : 0;
      const ok = isCorrect(text, item.a);
      done++; if (ok) right++; totalTok += tokens; totalDecodeS += decodeS; secs.push((end - start) / 1000); if (first) ttft.push((first - start) / 1000);
      log(`${String(done).padStart(2)} ${ok ? 'RIGHT' : 'WRONG'}  ${((end - start) / 1000).toFixed(1)} s  ${tokens} tok  expected ${item.a}  got ${extractNumber(text)}`);
      bar.value = done;
    }
    const sorted = [...secs].sort((a, b) => a - b);
    const pct = (p) => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))].toFixed(1) : '?';
    log('');
    log(`SUMMARY: ${right}/${done} correct (${done ? Math.round((100 * right) / done) : 0}%)`);
    log(`Decode speed: ${totalDecodeS ? (totalTok / totalDecodeS).toFixed(1) : '?'} tokens/s (average)`);
    log(`First token: ${ttft.length ? (ttft.reduce((a, b) => a + b, 0) / ttft.length).toFixed(2) : '?'} s (average)`);
    log(`Seconds per worked answer: median ${pct(0.5)}, slowest-10% ${pct(0.9)}`);
    status.textContent = stopRequested ? 'Stopped early. Result below.' : 'Done. Copy the result below.';
    await engine.unload();
  } catch (e) {
    log(`ERROR: ${String(e?.message ?? e).slice(0, 300)}`);
    status.textContent = 'Failed. Copy the result below anyway: the error helps.';
  } finally {
    $('run').disabled = false; $('stop').disabled = true;
  }
};
</script>
</body>
</html>
